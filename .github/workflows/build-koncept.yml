name: Prepocitat koncept stranky

# Bezi VYHRADNE na vetve koncept. Nikdy sa nedotyka main (produkcia).
# POZOR: automaticke spustanie pri zmene fia_data.json je ZAMERNE VYPNUTE
# (data v fia_data.json su este nekompletne oproti skutocnemu register.html - hrozila by strata obsahu).
# Spusti sa VYHRADNE rucne cez workflow_dispatch, az po overeni ze fia_data.json je kompletny zdroj.
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-koncept
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout koncept
        uses: actions/checkout@v4
        with:
          ref: koncept

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generovanie register.html + karty z fia_data.json
        run: python _data/gen_cards_full.py

      - name: Commit ak sa nieco zmenilo (len na koncept)
        run: |
          git config user.name "koncept-build-bot"
          git config user.email "actions@github.com"
          git add register.html karta-case-*.html
          if git diff --cached --quiet; then
            echo "Ziadna zmena, nic sa necommituje."
          else
            git commit -m "auto: prepocitane stranky z fia_data.json [skip ci]"
            git push origin HEAD:koncept
          fi
