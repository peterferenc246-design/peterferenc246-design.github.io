name: Prepocitat koncept karty

# Bezi VYHRADNE na vetve koncept. Nikdy sa nedotyka main (produkcia).
# Generuje a commituje LEN samostatne karty (karta-case-*.html) z _data/fia_data.json.
# register.html NIKDY necommituje - jeho dizajn a struktura ostavaju bez zmeny,
# udrziava sa vyhradne rucne.
on:
  push:
    branches: [koncept]
    paths:
      - '_data/fia_data.json'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-koncept
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout koncept
        uses: actions/checkout@v4
        with:
          ref: koncept

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generovanie kariet z fia_data.json (register.html sa zahodi, nikdy sa necommituje)
        run: |
          python _data/gen_cards_full.py
          git checkout -- register.html || true

      - name: Commit ak sa nieco zmenilo (len karty, len na koncept)
        run: |
          git config user.name "koncept-build-bot"
          git config user.email "actions@github.com"
          git add karta-case-*.html
          if git diff --cached --quiet; then
            echo "Ziadna zmena, nic sa necommituje."
          else
            git commit -m "auto: prepocitane karty z fia_data.json [skip ci]"
            git push origin HEAD:koncept
          fi
